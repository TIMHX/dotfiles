# 强制 Tmux 默认启动 Zsh
set-option -g default-shell /home/linuxbrew/.linuxbrew/bin/zsh
# 开启鼠标支持 (点击切换窗口、调整分屏大小、滚动日志)
set -g mouse on

# 2. 配置右键菜单：显示菜单 + 危险操作二次确认
# MouseDown3Pane 代表在面板上点击右键
unbind -n MouseDown3Pane
bind-key -n MouseDown3Pane menu -T "#[align=centre]  Tmux 快捷菜单 " \
    "󰊓 全屏/恢复当前面板"    z "resize-pane -Z" \
    "󰝤 水平分屏 (上下)"      - "split-window -v -c '#{pane_current_path}'" \
    "󰝣 垂直分屏 (左右)"      | "split-window -h -c '#{pane_current_path}'" \
    "" \
    "󰅖 关闭当前面板"         x "confirm-before -p \"确定要关闭当前面板吗? (y/n)\" kill-pane" \
    "󰗨 关闭其他所有面板"     o "confirm-before -p \"确定要杀死其他所有面板吗? (y/n)\" 'kill-pane -a'" \
    "" \
    "󰜺 退出菜单"             q ""

# 设置历史限制 (让你能往上翻更多的日志)
set -g history-limit 50000

# 解决分屏后路径不一致的问题 (保持在当前目录)
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# 解决 VS Code 里的颜色显示问题
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# 5. 自动重新编号窗口 (关掉一个窗口后，剩下的会自动排好)
set -g renumber-windows on

# --- 快捷键前缀修改 ---
# 取消默认的 Ctrl + b
unbind C-b

# 设置新的前缀键为 Ctrl + a
set -g prefix C-a

# 确保按两次 Ctrl + a 可以发送给终端程序（比如在命令行里跳到行首）
bind C-a send-prefix

# --- 面板管理快捷键优化 (更直观) ---
# 用 - 进行水平分屏 (更像减号横着切)
# 用 | 进行垂直分屏 (更像竖着切)
# 垂直分屏并保持当前目录 (修改你现有的 bind |)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# 这里的 export PATH 包含了 Homebrew 和 fzf 的路径，确保所有子命令都能跑通
bind-key "f" run-shell "export PATH=\$PATH:/home/linuxbrew/.linuxbrew/bin:/home/xing/.fzf/bin; sesh connect \"\$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-s:change-prompt(🔍  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'export PATH=\$PATH:/home/linuxbrew/.linuxbrew/bin; sesh preview {}'
)\""

# --- 面板布局快捷键 ---
# Ctrl+a 1/2/3/4 = 当前 window 调成 1/2/3/4 个面板（1 独占，2 左右，3 左大+右上下，4 四宫格）
# 面板变多直接加；变少先问 y/n
bind 1 if-shell -F '#{>:#{window_panes},1}' 'confirm-before -p "关掉其它面板，只留 1 格? (y/n)" "run-shell \"$HOME/bin/cc-layout 1 #{pane_id}\""' 'run-shell "$HOME/bin/cc-layout 1 #{pane_id}"'
bind 2 if-shell -F '#{>:#{window_panes},2}' 'confirm-before -p "关掉多余面板，变成 2 格? (y/n)" "run-shell \"$HOME/bin/cc-layout 2 #{pane_id}\""' 'run-shell "$HOME/bin/cc-layout 2 #{pane_id}"'
bind 3 if-shell -F '#{>:#{window_panes},3}' 'confirm-before -p "关掉多余面板，变成 3 格? (y/n)" "run-shell \"$HOME/bin/cc-layout 3 #{pane_id}\""' 'run-shell "$HOME/bin/cc-layout 3 #{pane_id}"'
bind 4 if-shell -F '#{>:#{window_panes},4}' 'confirm-before -p "关掉多余面板，变成 4 格? (y/n)" "run-shell \"$HOME/bin/cc-layout 4 #{pane_id}\""' 'run-shell "$HOME/bin/cc-layout 4 #{pane_id}"'

# --- 面板轮换 ---
# o / Tab 依次切到下一个面板，-r 表示按一次前缀后可连点（repeat-time 内）
bind -r o   select-pane -t :.+
bind -r Tab select-pane -t :.+
